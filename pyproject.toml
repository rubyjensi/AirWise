[project]
name = "aqi-web-app"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.32.0",
    "groq>=0.13.0",
    "google-genai>=0.1.1",
]

[project.scripts]
aqi-web-app = "aqi_web_app:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]

